<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Você</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Impede a seleção de texto e o zoom no celular */
            -webkit-tap-highlight-color: transparent;
            user-select: none; 
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Courier Prime', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Configuração das Telas */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh; /* Altura dinâmica para o Safari do iPhone */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- TELA 1: ENVELOPE --- */
        #screen-envelope {
            cursor: pointer;
            background-color: #ffffff;
        }

        .envelope-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pulse 2s infinite;
        }

        .black-box {
            background-color: #000000;
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 40px;
            font-family: Arial, sans-serif; /* Fonte parecida com a imagem */
            letter-spacing: 0.5px;
        }

        /* Desenho do envelope usando CSS */
        .envelope {
            position: relative;
            width: 140px;
            height: 100px;
            border: 6px solid #000;
            border-radius: 8px;
            background-color: transparent;
        }

        /* Aba do envelope */
        .envelope::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            width: 130px;
            height: 70px;
            border-bottom: 6px solid #000;
            border-right: 6px solid transparent;
            border-left: 6px solid transparent;
            transform-origin: top;
            transform: rotateX(0deg);
            transition: transform 0.5s;
        }

        .envelope::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            width: 130px;
            height: 70px;
            border-left: 6px solid #000;
            border-right: 6px solid transparent;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            transform: rotate(45deg);
            transform-origin: top left;
            display: none; /* Simplificando o desenho */
        }

        /* Selo vermelho */
        .seal {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 20px;
            background-color: #ff0000;
            border-radius: 50%;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- TELA 2: FLORES --- */
        #screen-flowers {
            background-color: #fcfcfc;
            overflow: hidden;
            z-index: 10;
        }

        .flower {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 50px; /* Tamanho base da flor */
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            will-change: transform, opacity;
        }

        .flower.bloom {
            animation: bloomOut 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes bloomOut {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(var(--scale)) rotate(var(--rot));
                opacity: 1;
            }
        }

        /* --- TELA 3: CARTA FINAL --- */
        #screen-letter {
            background-color: #ff8b9d; /* Cor rosa parecida com a imagem */
            padding: 30px;
            text-align: center;
            z-index: 20;
        }

        .letter-content {
            color: #ffffff;
            font-size: 18px;
            line-height: 1.6;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: translateY(20px);
            opacity: 0;
            transition: all 1s ease 0.5s;
        }

        #screen-letter.active .letter-content {
            transform: translateY(0);
            opacity: 1;
        }

        .letter-content p {
            text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
        }

        .rose {
            font-size: 24px;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <!-- TELA 1: O Envelope Inicial -->
    <div id="screen-envelope" class="screen active" onclick="startExperience()">
        <div class="envelope-container">
            <div class="black-box">Fiz algo para você!!!</div>
            <div class="envelope">
                <div class="seal"></div>
            </div>
        </div>
    </div>

    <!-- TELA 2: Explosão de Flores -->
    <div id="screen-flowers" class="screen">
        <!-- As flores serão geradas aqui via JavaScript -->
    </div>

    <!-- TELA 3: A Carta Final -->
    <div id="screen-letter" class="screen">
        <div class="letter-content">
            <p>Espero que tenha gostado do nosso encontro.</p>
            <p>Queria fazer desse dia algo um pouquinho diferente, algo que pudesse ficar guardado de alguma forma, mesmo depois que ele terminasse.</p>
            <p>E pensei que algumas flores e algumas palavras seriam uma maneira bonita de fazer isso.</p>
            <span class="rose">🌹</span>
        </div>
    </div>

    <script>
        // Lista de emojis de flores para a animação
        const flowers = ['🌸', '🌺', '🌻', '🌼', '🌹', '🌷', '🌸', '🌺'];
        
        function startExperience() {
            // Esconde a tela do envelope
            document.getElementById('screen-envelope').classList.remove('active');
            
            // Mostra a tela das flores
            const flowerScreen = document.getElementById('screen-flowers');
            flowerScreen.classList.add('active');

            // Cria o efeito de explosão de flores
            createFlowerBurst();

            // Após 5 segundos, esconde as flores e mostra a carta
            setTimeout(() => {
                flowerScreen.classList.remove('active');
                document.getElementById('screen-letter').classList.add('active');
            }, 5000); // 5000 milissegundos = 5 segundos
        }

        function createFlowerBurst() {
            const container = document.getElementById('screen-flowers');
            const numberOfFlowers = 50; // Quantidade de flores na tela

            for (let i = 0; i < numberOfFlowers; i++) {
                const flower = document.createElement('div');
                flower.classList.add('flower');
                
                // Escolhe um emoji aleatório
                flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                
                // Gera posições aleatórias para onde as flores vão crescer
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 150; // Distância do centro em vw/vh
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                const scale = 1 + Math.random() * 3; // Tamanho final (de 1x a 4x)
                const rot = (Math.random() - 0.5) * 180; // Rotação aleatória
                
                // Define as variáveis CSS para a animação
                flower.style.setProperty('--tx', `${tx}vw`);
                flower.style.setProperty('--ty', `${ty}vh`);
                flower.style.setProperty('--scale', scale);
                flower.style.setProperty('--rot', `${rot}deg`);
                
                // Adiciona um pequeno atraso aleatório para parecer natural
                const delay = Math.random() * 1.5; 
                flower.style.animationDelay = `${delay}s`;

                container.appendChild(flower);
                
                // Ativa a animação
                setTimeout(() => {
                    flower.classList.add('bloom');
                }, 50);
            }
        }
    </script>
</body>
</html>
